<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>시연 마작 솔리테어 (Si-Yeon Mahjong Solitaire)</title>
  <style>
    :root {
      --bg-gradient-start: #eef7f2;
      --bg-gradient-end: #d6ebd9;
      --tile-w: 66px;
      --tile-h: 88px;
      --tile-radius: 10px;
      --tile-face: #ffffff;
      --tile-face-bottom: #f5eedf;
      --accent-mint: #2ea779;
      --accent-mint-hover: #238962;
      --accent-gold: #f39c12;
      --text-dark: #1e3329;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-family);
      background: radial-gradient(circle at center 30%, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      touch-action: manipulation;
    }

    /* 상단 헤더 UI */
    header {
      width: 100%;
      max-width: 860px;
      padding: 14px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(24, 60, 44, 0.07);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
    }

    .stat-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 75px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: #5c8772;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-dark);
      font-variant-numeric: tabular-nums;
    }

    .controls-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 42px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      color: #214e39;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(24, 60, 44, 0.08);
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .diff-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      background: #2980b9;
      box-shadow: 0 2px 6px rgba(41, 128, 185, 0.35);
      letter-spacing: 0.5px;
    }

    .diff-select {
      height: 42px;
      padding: 0 12px;
      border-radius: 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      cursor: pointer;
      font-weight: 800;
      font-size: 13px;
      color: #174232;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(24, 60, 44, 0.08);
      outline: none;
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .diff-select:hover {
      background: #ffffff;
      border-color: var(--accent-mint);
      box-shadow: 0 6px 18px rgba(46, 167, 121, 0.2);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(24, 60, 44, 0.15);
      color: var(--accent-mint);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(24, 60, 44, 0.1);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-icon {
      font-size: 16px;
    }

    /* 게임 뷰포트 & 보드 */
    .game-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1100px;
      perspective-origin: 50% 38%;
    }

    .game-board {
      position: absolute;
      width: 730px;
      height: 545px;
      transform-origin: center center;
      transform-style: preserve-3d;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    /* 타일 (Mahjong Tile) 3D 렌더링 - 맑고 밝은 상아/도자기 페이스 + 비취 2단 적층 바디 */
    .tile {
      position: absolute;
      width: var(--tile-w);
      height: var(--tile-h);
      border-radius: var(--tile-radius);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(165deg, #ffffff 0%, #fdfbf7 55%, #f6efe2 100%);
      border-top: 1.5px solid rgba(255, 255, 255, 0.95);
      border-left: 1.5px solid rgba(255, 255, 255, 0.85);
      border-right: 1px solid rgba(210, 195, 175, 0.5);
      border-bottom: 1px solid rgba(190, 175, 155, 0.6);
      transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.4, 1.1),
                  filter 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease;
      will-change: transform, filter, box-shadow;
      outline: none;
      transform-style: preserve-3d;

      /* 정밀 3D 적층 두께: 1~3px 백색 상아 본체층 + 4~8px 에메랄드 비취 바닥층 */
      box-shadow:
        inset 1px 1px 1px rgba(255, 255, 255, 0.9),
        inset -1px -1px 2px rgba(180, 160, 135, 0.2),
        1px 1px 0 #ede5d4,
        2px 2px 0 #dfd5bf,
        3px 3px 0 #cfc2a8,
        4px 4px 0 #287756,
        5px 5px 0 #206346,
        6px 6px 0 #195239,
        7px 7px 0 #123e2b,
        8px 8px 0 #0d2c1e,
        6px 10px 16px rgba(10, 35, 22, 0.26);
    }

    /* 타일 표면 빛 반사(Specular Sheen) 오버레이 */
    .tile::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--tile-radius);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.1) 40%, rgba(0, 0, 0, 0.02) 100%);
      pointer-events: none;
    }

    /* 층(Layer 0, 1, 2)별 차등 입체감 및 높이 그림자 */
    .tile.layer-0 {
      /* 바닥 기본 레이어 */
      box-shadow:
        inset 1px 1px 1px rgba(255, 255, 255, 0.9),
        1px 1px 0 #ede5d4,
        2px 2px 0 #dfd5bf,
        3px 3px 0 #cfc2a8,
        4px 4px 0 #287756,
        5px 5px 0 #206346,
        6px 6px 0 #195239,
        7px 7px 0 #123e2b,
        5px 9px 14px rgba(10, 35, 22, 0.24);
    }

    .tile.layer-1 {
      /* 2단 중층 레이어: 아래 패 표면에 떨어지는 짙은 Contact Shadow */
      filter: brightness(1.02);
      box-shadow:
        inset 1px 1px 1px rgba(255, 255, 255, 0.95),
        1px 1px 0 #eee7d7,
        2px 2px 0 #dfd5bf,
        3px 3px 0 #cfc2a8,
        4px 4px 0 #2c815d,
        5px 5px 0 #226b4c,
        6px 6px 0 #1a563c,
        7px 7px 0 #13422e,
        8px 8px 0 #0d2e20,
        3px 6px 8px rgba(0, 0, 0, 0.28),
        8px 14px 22px rgba(10, 35, 22, 0.38);
    }

    .tile.layer-2 {
      /* 3단 정상 피라미드 레이어: 최상단 하이라이트 + 깊은 Ambient Occlusion */
      filter: brightness(1.04);
      border-top: 1.8px solid #ffffff;
      box-shadow:
        inset 1px 1px 1.5px rgba(255, 255, 255, 1),
        1px 1px 0 #f0e9dc,
        2px 2px 0 #e2d9c5,
        3px 3px 0 #d2c6af,
        4px 4px 0 #318f67,
        5px 5px 0 #267755,
        6px 6px 0 #1d5f43,
        7px 7px 0 #154832,
        8px 8px 0 #0e3223,
        9px 9px 0 #082016,
        4px 8px 12px rgba(0, 0, 0, 0.35),
        12px 20px 30px rgba(8, 30, 18, 0.48);
    }

    /* 타일 상단 코너 배지 (숫자/기호) - 가독성 강화 */
    .tile-corner-badge {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 12px;
      font-weight: 900;
      color: #3b5046;
      line-height: 1;
      pointer-events: none;
      letter-spacing: -0.2px;
      text-shadow: 0 0 2px rgba(255, 255, 255, 0.95), 1px 1px 0 rgba(255, 255, 255, 0.9);
      z-index: 2;
    }

    .tile-sub-label {
      position: absolute;
      bottom: 4px;
      right: 5px;
      font-size: 11px;
      font-weight: 900;
      color: #4a6356;
      line-height: 1;
      pointer-events: none;
      text-shadow: 0 0 2px rgba(255, 255, 255, 0.95), 1px 1px 0 rgba(255, 255, 255, 0.9);
      z-index: 2;
    }

    /* 타일 내부 그래픽 래퍼 및 음각(Engraved) 각인 디테일 */
    .tile-graphic-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 2px 4px;
      pointer-events: none;
      position: relative;
      z-index: 1;
    }

    .tile-svg {
      width: 52px;
      height: 64px;
      overflow: visible;
      /* 실물 마작패 특유의 음각 파임 효과 (하단 하이라이트 + 내부 음영) */
      filter: drop-shadow(0.7px 0.8px 0px rgba(255, 255, 255, 0.85)) drop-shadow(-0.5px -0.5px 0.5px rgba(0, 0, 0, 0.22));
    }

    /* 선택 가능 vs 불가 타일 명암/상태 */
    .tile.free {
      cursor: pointer;
    }

    .tile.free:hover {
      transform: translate3d(var(--tx), calc(var(--ty) - 8px), calc(var(--tz) + 20px)) !important;
      box-shadow:
        inset 1px 1px 1.5px rgba(255, 255, 255, 1),
        1px 1px 0 #f2ece0,
        2px 2px 0 #e4dbca,
        3px 3px 0 #d4c8b2,
        4px 4px 0 #34a374,
        5px 5px 0 #288b61,
        6px 6px 0 #1f724e,
        7px 7px 0 #17593c,
        8px 8px 0 #10412b,
        4px 8px 12px rgba(0, 0, 0, 0.2),
        10px 22px 28px rgba(35, 120, 80, 0.38);
    }

    /* 잠긴 타일: 100% 완전 불투명(비침 방지) + 상위 패 그늘에 가려진 은은한 앰비언트 쉐이딩 */
    .tile.blocked {
      cursor: default;
      background: linear-gradient(165deg, #e2e8e4 0%, #d5ded8 65%, #c8d3cc 100%);
      filter: brightness(0.89) contrast(0.94);
      opacity: 1; /* 투명 비침 완전 제거 */
      box-shadow:
        1px 1px 0 #c7d5cd,
        2px 2px 0 #b7c7be,
        3px 3px 0 #a5b7ad,
        4px 4px 0 #1e523c,
        5px 5px 0 #174230,
        6px 6px 0 #113324,
        3px 6px 12px rgba(15, 45, 30, 0.2);
    }

    .tile.blocked .tile-graphic-wrap {
      filter: grayscale(0.25) brightness(0.82);
    }

    /* 선택된 타일: 공중에 떠오른 3D 리프팅 + 비취 에메랄드 오라 */
    .tile.selected {
      transform: translate3d(var(--tx), calc(var(--ty) - 14px), calc(var(--tz) + 40px)) !important;
      background: #ffffff;
      border-color: #ffffff;
      box-shadow:
        0 0 0 3px var(--accent-mint),
        inset 1px 1px 2px rgba(255, 255, 255, 1),
        1px 1px 0 #f2ece0,
        2px 2px 0 #e4dbca,
        3px 3px 0 #d4c8b2,
        4px 4px 0 #34a374,
        5px 5px 0 #288b61,
        6px 6px 0 #1f724e,
        7px 7px 0 #17593c,
        8px 8px 0 #10412b,
        0 8px 16px rgba(0, 0, 0, 0.25),
        0 18px 36px rgba(46, 167, 121, 0.5) !important;
    }

    /* 힌트 하이라이트 애니메이션 */
    .tile.hinted {
      animation: hintPulse 1.1s infinite alternate ease-in-out;
    }

    @keyframes hintPulse {
      0% {
        box-shadow: 0 0 0 2px var(--accent-gold), 4px 6px 14px rgba(15, 45, 30, 0.3);
      }
      100% {
        box-shadow: 0 0 20px 5px var(--accent-gold), 0 14px 28px rgba(243, 156, 18, 0.55);
        transform: translate3d(var(--tx), calc(var(--ty) - 10px), calc(var(--tz) + 30px));
      }
    }

    /* 매칭 제거 애니메이션 */
    .tile.matching {
      pointer-events: none;
      animation: matchSuccess 0.42s forwards cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 1000 !important;
    }

    @keyframes matchSuccess {
      0% {
        transform: translate3d(var(--tx), var(--ty), calc(var(--tz) + 20px)) scale(1);
        opacity: 1;
      }
      50% {
        transform: translate3d(var(--tx), calc(var(--ty) - 22px), calc(var(--tz) + 60px)) scale(1.15);
        filter: brightness(1.25);
        opacity: 0.9;
      }
      100% {
        transform: translate3d(var(--tx), calc(var(--ty) - 36px), calc(var(--tz) + 90px)) scale(0.4);
        opacity: 0;
      }
    }

    /* 하단 안내 바 */
    footer {
      width: 100%;
      max-width: 860px;
      padding: 8px 16px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #3b6652;
      font-weight: 600;
    }

    .moves-badge {
      background: rgba(255, 255, 255, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(24, 60, 44, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    /* 모달 팝업 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 43, 33, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      width: 90%;
      max-width: 380px;
      padding: 32px 24px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(16, 46, 33, 0.22);
      transform: scale(0.85) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: #174232;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 15px;
      color: #557967;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .modal-stats {
      background: #f1f8f4;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-around;
    }

    .modal-stat-item {
      display: flex;
      flex-direction: column;
    }

    .modal-stat-label {
      font-size: 11px;
      color: #6d9380;
      font-weight: 700;
    }

    .modal-stat-val {
      font-size: 20px;
      font-weight: 800;
      color: #1a4f3b;
    }

    .modal-btn {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2ea779, #20875c);
      color: white;
      font-size: 16px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(32, 135, 92, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(32, 135, 92, 0.45);
    }

    /* 화면 흔들림 및 판 파괴 애니메이션 */
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-8px, 6px) rotate(-1deg); }
      30% { transform: translate(7px, -6px) rotate(1.2deg); }
      45% { transform: translate(-6px, -4px) rotate(-0.8deg); }
      60% { transform: translate(5px, 5px) rotate(0.6deg); }
      75% { transform: translate(-3px, 2px) rotate(-0.3deg); }
      90% { transform: translate(2px, -1px) rotate(0.1deg); }
    }

    .shaking {
      animation: screenShake 0.55s ease-out !important;
    }

    /* 판 깨짐 파편 컨테이너 및 조각 */
    .board-shatter-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1500;
      overflow: hidden;
    }

    .shatter-piece {
      position: absolute;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(210, 240, 225, 0.8));
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 20px rgba(10, 40, 25, 0.28);
      transition: transform 0.75s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.75s ease;
      will-change: transform, opacity;
      backdrop-filter: blur(2px);
      border-radius: 4px;
    }

    /* 대형 WIN 배너 애니메이션 */
    .big-win-banner {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      font-size: clamp(52px, 14vw, 92px);
      font-weight: 900;
      color: #ffd700;
      text-shadow:
        0 0 12px rgba(255, 215, 0, 0.85),
        0 0 30px rgba(255, 140, 0, 0.8),
        0 6px 20px rgba(0, 0, 0, 0.45);
      z-index: 1800;
      pointer-events: none;
      opacity: 0;
      letter-spacing: 6px;
      animation: bigWinPop 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      white-space: nowrap;
    }

    @keyframes bigWinPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(-8deg);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(2deg);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
    }

    /* 피날레 알림 배지 */
    .finale-notice {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      padding: 8px 22px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4);
      z-index: 1600;
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }

    .finale-notice.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 모바일 반응형 최적화 (보드 영역 극대화 및 터치 조작 최적화) */
    @media (max-width: 680px) {
      header {
        padding: 6px 10px 4px;
        gap: 6px;
      }

      .status-bar {
        padding: 5px 8px;
        border-radius: 14px;
        gap: 2px;
      }

      .stat-pill {
        min-width: 42px;
      }

      .stat-label {
        font-size: 9px;
      }

      .stat-val {
        font-size: 14px;
      }

      .diff-badge {
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 6px;
      }

      .controls-bar {
        gap: 4px;
        flex-wrap: wrap;
      }

      .diff-select {
        height: 34px;
        padding: 0 6px;
        font-size: 11px;
        border-radius: 10px;
      }

      .btn {
        height: 34px;

  <!-- 승리 및 알림 모달 -->
  <div class="modal-overlay" id="modal">

  <script>
    /**
     * Web Audio API 기반 무외장 사운드 신시사이저
     */
    class SoundFX {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // 타일 선택음: 상아패를 톡 건드리는 경쾌하고 맑은 타격음
      playSelect() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.07);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      // 매칭 성공음: 맑고 영롱한 힐링 차임벨 (2화음 펜타토닉)
      playMatch() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [587.33, 880.00]; // D5, A5

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);

          gain.gain.setValueAtTime(0.22, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.06 + 0.45);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.48);
        });
      }

      // 셔플 및 리셋 사운드
      playShuffle() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        for (let i = 0; i < 5; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const time = now + i * 0.05;

          osc.type = 'sine';
          osc.frequency.setValueAtTime(320 + Math.random() * 220, time);
          gain.gain.setValueAtTime(0.12, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(time);
          osc.stop(time + 0.07);
        }
      }

      // 승리 팡파레: 밝은 힐링 아르페지오
      playWin() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5 E5 G5 C6 E6
        chord.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + i * 0.12;

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.28, t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.85);
        });
      }

      // 판 파괴 및 유리/도자기 깨짐 효과음
      playShatter() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // 1) 묵직한 충격파 (피치 다운)
        const subOsc = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        subOsc.type = 'triangle';
        subOsc.frequency.setValueAtTime(140, now);
        subOsc.frequency.exponentialRampToValueAtTime(28, now + 0.36);
        subGain.gain.setValueAtTime(0.45, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        subOsc.connect(subGain);
        subGain.connect(this.ctx.destination);
        subOsc.start(now);
        subOsc.stop(now + 0.38);

        // 2) 쨍그랑 유리 파편 흩어지는 고음 클러스터
        for (let i = 0; i < 7; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + 0.03 + i * 0.035;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1600 + Math.random() * 2600, t);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.18);
        }
      }
    }

    /**
     * 순수 SVG 기반 초고화질/선명한 마작 그래픽 생성기
     * OS 폰트 글리프 의존성을 0%로 만들어 모든 기기에서 쨍하고 선명하게 렌더링
     */
    const SvgFactory = {
      // 만수 (Wan 1-9): 위쪽 붉은 한자 숫자 + 아래쪽 萬
      wan(numStr, hanzi) {
        return `
          <svg class="tile-svg" viewBox="0 0 48 60">
            <text x="24" y="24" text-anchor="middle" font-size="22" font-weight="900" fill="#d32f2f" font-family="'Noto Serif KR', 'Songti SC', 'Batang', serif">${hanzi}</text>
            <text x="24" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#b71c1c" font-family="'Noto Serif KR', 'Songti SC', 'Batang', serif">萬</text>
          </svg>
        `;
      },

      // 통수(Tong / Dot 1-9) 원형 렌더러
      circle(cx, cy, r, color, ringColor) {
        return `
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="${ringColor || '#ffffff'}" stroke-width="1.2"/>
          <circle cx="${cx}" cy="${cy}" r="${r * 0.4}" fill="#ffffff" opacity="0.8"/>
        `;
      },

      tong(val) {
        const C_BLUE = '#1976d2';
        const C_GREEN = '#2e7d32';
        const C_RED = '#d32f2f';

        let inner = '';
        if (val === 1) {
          // 화려한 1통 연꽃무늬 동심원
          inner = `
            <circle cx="24" cy="30" r="17" fill="${C_RED}" stroke="#b71c1c" stroke-width="1.5"/>
            <circle cx="24" cy="30" r="12" fill="${C_BLUE}" stroke="#0d47a1" stroke-width="1.5"/>
            <circle cx="24" cy="30" r="7" fill="${C_GREEN}"/>
            <circle cx="24" cy="30" r="3" fill="#ffffff"/>
          `;
        } else if (val === 2) {
          inner = this.circle(24, 18, 8, C_GREEN) + this.circle(24, 42, 8, C_BLUE);
        } else if (val === 3) {
          inner = this.circle(14, 16, 6.5, C_BLUE) + this.circle(24, 30, 6.5, C_RED) + this.circle(34, 44, 6.5, C_GREEN);
        } else if (val === 4) {
          inner = this.circle(16, 18, 6.5, C_BLUE) + this.circle(32, 18, 6.5, C_GREEN) +
                  this.circle(16, 42, 6.5, C_GREEN) + this.circle(32, 42, 6.5, C_BLUE);
        } else if (val === 5) {
          inner = this.circle(14, 16, 6, C_BLUE) + this.circle(34, 16, 6, C_GREEN) +
                  this.circle(24, 30, 7, C_RED) +
                  this.circle(14, 44, 6, C_GREEN) + this.circle(34, 44, 6, C_BLUE);
        } else if (val === 6) {
          inner = this.circle(16, 16, 5.5, C_GREEN) + this.circle(32, 16, 5.5, C_GREEN) +
                  this.circle(16, 30, 5.5, C_RED) + this.circle(32, 30, 5.5, C_RED) +
                  this.circle(16, 44, 5.5, C_RED) + this.circle(32, 44, 5.5, C_RED);
        } else if (val === 7) {
          inner = this.circle(13, 14, 5, C_GREEN) + this.circle(24, 21, 5, C_GREEN) + this.circle(35, 28, 5, C_GREEN) +
                  this.circle(16, 40, 5, C_RED) + this.circle(32, 40, 5, C_RED) +
                  this.circle(16, 51, 5, C_RED) + this.circle(32, 51, 5, C_RED);
        } else if (val === 8) {
          for (let i = 0; i < 4; i++) {
            inner += this.circle(16, 14 + i * 11, 4.8, C_BLUE);
            inner += this.circle(32, 14 + i * 11, 4.8, C_BLUE);
          }
        } else if (val === 9) {
          for (let r = 0; r < 3; r++) {
            const color = r === 0 ? C_BLUE : (r === 1 ? C_RED : C_GREEN);
            inner += this.circle(13, 15 + r * 15, 5, color);
            inner += this.circle(24, 15 + r * 15, 5, color);
            inner += this.circle(35, 15 + r * 15, 5, color);
          }
        }
        return `<svg class="tile-svg" viewBox="0 0 48 60">${inner}</svg>`;
      },

      // 삭수 (Tiao / Bamboo 1-9) 대나무 마디 렌더러
      bamboo(x, y, w, h, color) {
        return `
          <g transform="translate(${x}, ${y})">
            <rect x="0" y="0" width="${w}" height="${h}" rx="${w/2}" fill="${color}"/>
            <line x1="-1" y1="${h/2}" x2="${w+1}" y2="${h/2}" stroke="#ffffff" stroke-width="1.2"/>
          </g>
        `;
      },

      tiao(val) {
        const C_GREEN = '#2e7d32';
        const C_RED = '#d32f2f';
        const C_BLUE = '#1976d2';

        let inner = '';
        if (val === 1) {
          // 1삭: 예쁜 참새/공작새 실루엣 SVG
          inner = `
            <path d="M 24 12 C 28 12 32 15 32 20 C 32 24 28 26 34 32 C 38 36 40 44 38 48 C 34 46 30 40 26 42 C 22 44 20 48 14 48 C 12 44 14 36 18 32 C 20 30 18 24 18 20 C 18 15 20 12 24 12 Z" fill="${C_GREEN}"/>
            <circle cx="27" cy="18" r="2" fill="#ffffff"/>
            <circle cx="27.5" cy="18" r="1" fill="#1b5e20"/>
            <path d="M 32 18 L 38 20 L 32 22 Z" fill="#f57c00"/>
            <path d="M 22 28 C 26 28 30 32 28 38 C 24 38 20 34 22 28 Z" fill="${C_RED}"/>
          `;
        } else if (val === 2) {
          inner = this.bamboo(20, 10, 8, 18, C_GREEN) + this.bamboo(20, 32, 8, 18, C_BLUE);
        } else if (val === 3) {
          inner = this.bamboo(20, 9, 8, 17, C_BLUE) +
                  this.bamboo(13, 31, 8, 17, C_GREEN) + this.bamboo(27, 31, 8, 17, C_GREEN);
        } else if (val === 4) {
          inner = this.bamboo(14, 10, 7, 18, C_BLUE) + this.bamboo(27, 10, 7, 18, C_GREEN) +
                  this.bamboo(14, 32, 7, 18, C_GREEN) + this.bamboo(27, 32, 7, 18, C_BLUE);
        } else if (val === 5) {
          inner = this.bamboo(13, 9, 7, 17, C_GREEN) + this.bamboo(28, 9, 7, 17, C_BLUE) +
                  this.bamboo(20.5, 21, 7, 18, C_RED) +
                  this.bamboo(13, 34, 7, 17, C_BLUE) + this.bamboo(28, 34, 7, 17, C_GREEN);
        } else if (val === 6) {
          for (let col = 0; col < 3; col++) {
            inner += this.bamboo(11 + col * 10, 10, 6, 18, C_GREEN);
            inner += this.bamboo(11 + col * 10, 32, 6, 18, C_BLUE);
          }
        } else if (val === 7) {
          inner = this.bamboo(20.5, 8, 7, 16, C_RED);
          for (let col = 0; col < 3; col++) {
            inner += this.bamboo(11 + col * 10, 26, 6, 14, C_GREEN);
            inner += this.bamboo(11 + col * 10, 42, 6, 14, C_BLUE);
          }
        } else if (val === 8) {
          inner = `
            <path d="M 12 12 L 20 24 L 16 24 L 8 12 Z" fill="${C_GREEN}"/>
            <path d="M 36 12 L 28 24 L 32 24 L 40 12 Z" fill="${C_GREEN}"/>
            <path d="M 12 48 L 20 36 L 16 36 L 8 48 Z" fill="${C_BLUE}"/>
            <path d="M 36 48 L 28 36 L 32 36 L 40 48 Z" fill="${C_BLUE}"/>
            ${this.bamboo(13, 22, 6, 16, C_GREEN)}
            ${this.bamboo(29, 22, 6, 16, C_BLUE)}
          `;
        } else if (val === 9) {
          for (let col = 0; col < 3; col++) {
            inner += this.bamboo(11 + col * 10, 9, 6, 13, C_RED);
            inner += this.bamboo(11 + col * 10, 24, 6, 13, C_BLUE);
            inner += this.bamboo(11 + col * 10, 39, 6, 13, C_GREEN);
          }
        }
        return `<svg class="tile-svg" viewBox="0 0 48 60">${inner}</svg>`;
      },

      // 삼원패 & 풍패 렌더러
      honor(type) {
        if (type === 'chun') {
          return `
            <svg class="tile-svg" viewBox="0 0 48 60">
              <text x="24" y="42" text-anchor="middle" font-size="38" font-weight="900" fill="#d32f2f" font-family="'Noto Serif KR', 'Songti SC', 'Batang', serif">中</text>
            </svg>
          `;
        }
        if (type === 'fa') {
          return `
            <svg class="tile-svg" viewBox="0 0 48 60">
              <text x="24" y="42" text-anchor="middle" font-size="38" font-weight="900" fill="#2e7d32" font-family="'Noto Serif KR', 'Songti SC', 'Batang', serif">發</text>
            </svg>
          `;
        }
        if (type === 'bai') {
          // 백판: 시원하고 깔끔한 청색 이중 사각 프레임
          return `
            <svg class="tile-svg" viewBox="0 0 48 60">
              <rect x="9" y="10" width="30" height="40" rx="4" fill="none" stroke="#1976d2" stroke-width="3"/>
              <rect x="13" y="14" width="22" height="32" rx="2" fill="none" stroke="#64b5f6" stroke-width="1.5"/>
            </svg>
          `;
        }
      },

      wind(char) {
        return `
          <svg class="tile-svg" viewBox="0 0 48 60">
            <text x="24" y="42" text-anchor="middle" font-size="36" font-weight="900" fill="#1e3a2b" font-family="'Noto Serif KR', 'Songti SC', 'Batang', serif">${char}</text>
          </svg>
        `;
      },

      // 사군자 꽃패 (Flowers)
      flower(hanzi, color, sub) {
        return `
          <svg class="tile-svg" viewBox="0 0 48 60">
            <circle cx="24" cy="27" r="15" fill="${color}" opacity="0.14"/>
            <circle cx="24" cy="27" r="14" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="2.5,2"/>
            <text x="24" y="35" text-anchor="middle" font-size="27" font-weight="900" fill="${color}" font-family="'Noto Serif KR', 'Songti SC', 'Batang', serif">${hanzi}</text>
            <text x="24" y="51" text-anchor="middle" font-size="9.5" font-weight="800" fill="${color}">${sub}</text>
          </svg>
        `;
      },

      // 사계절 계절패 (Seasons)
      season(hanzi, color, sub) {
        return `
          <svg class="tile-svg" viewBox="0 0 48 60">
            <rect x="8" y="9" width="32" height="34" rx="6" fill="${color}" opacity="0.12"/>
            <rect x="8" y="9" width="32" height="34" rx="6" fill="none" stroke="${color}" stroke-width="1.8"/>
            <text x="24" y="34" text-anchor="middle" font-size="26" font-weight="900" fill="${color}" font-family="'Noto Serif KR', 'Songti SC', 'Batang', serif">${hanzi}</text>
            <text x="24" y="51" text-anchor="middle" font-size="9.5" font-weight="800" fill="${color}">${sub}</text>
          </svg>
        `;
      },

      // 사신수 영수패 (Mythic Beasts)
      myth(hanzi, color, sub) {
        return `
          <svg class="tile-svg" viewBox="0 0 48 60">
            <polygon points="24,7 39,26 24,44 9,26" fill="${color}" opacity="0.15"/>
            <polygon points="24,7 39,26 24,44 9,26" fill="none" stroke="${color}" stroke-width="2"/>
            <text x="24" y="34" text-anchor="middle" font-size="24" font-weight="900" fill="${color}" font-family="'Noto Serif KR', 'Songti SC', 'Batang', serif">${hanzi}</text>
            <text x="24" y="52" text-anchor="middle" font-size="9" font-weight="900" fill="${color}">${sub}</text>
          </svg>
        `;
      }
    };

    /**
     * 마작 패 데이터 목록 (총 46종)
     */
    const TILE_DEFINITIONS = [
      // 만수 (1-9)

      easy: {
        name: '쉬움',
        badgeColor: '#2ea779',
        filter: (def) => (def.suit === 'wan' && def.val <= 6) || (def.suit === 'tong' && def.val <= 6) || (def.suit === 'tiao' && def.val <= 3) // 15종 풀

      master: {

    /**
     * 3단 입체 피라미드 보드 레이아웃 (총 54개 슬롯, 27쌍)
     */
    function createBoardLayout() {
      const slots = [];
      let nextId = 1;

      // Layer 0: 기본 베이스 (38개 타일)
      const l0Coords = [
        // 상단 날개
        { x: 6, y: 0 }, { x: 8, y: 0 }, { x: 10, y: 0 }, { x: 12, y: 0 },
        // 행 1
        { x: 4, y: 2 }, { x: 6, y: 2 }, { x: 8, y: 2 }, { x: 10, y: 2 }, { x: 12, y: 2 }, { x: 14, y: 2 },
        // 행 2 (중앙 넓은 열)
        { x: 2, y: 4 }, { x: 4, y: 4 }, { x: 6, y: 4 }, { x: 8, y: 4 }, { x: 10, y: 4 }, { x: 12, y: 4 }, { x: 14, y: 4 }, { x: 16, y: 4 },
        // 행 3
        { x: 2, y: 6 }, { x: 4, y: 6 }, { x: 6, y: 6 }, { x: 8, y: 6 }, { x: 10, y: 6 }, { x: 12, y: 6 }, { x: 14, y: 6 }, { x: 16, y: 6 },
        // 행 4
        { x: 4, y: 8 }, { x: 6, y: 8 }, { x: 8, y: 8 }, { x: 10, y: 8 }, { x: 12, y: 8 }, { x: 14, y: 8 },
        // 하단 날개
        { x: 6, y: 10 }, { x: 8, y: 10 }, { x: 10, y: 10 }, { x: 12, y: 10 },
        // 좌우 돌출 날개
        { x: 0, y: 5 }, { x: 18, y: 5 }
      ];
      l0Coords.forEach(c => slots.push({ slotId: nextId++, x: c.x, y: c.y, z: 0 }));

      // Layer 1: 중앙 피라미드 중층 (12개 타일)
      const l1Coords = [
        { x: 6, y: 3 }, { x: 8, y: 3 }, { x: 10, y: 3 }, { x: 12, y: 3 },
        { x: 6, y: 5 }, { x: 8, y: 5 }, { x: 10, y: 5 }, { x: 12, y: 5 },
        { x: 6, y: 7 }, { x: 8, y: 7 }, { x: 10, y: 7 }, { x: 12, y: 7 }
      ];
      l1Coords.forEach(c => slots.push({ slotId: nextId++, x: c.x, y: c.y, z: 1 }));

      // Layer 2: 정상 꼭대기 (4개 타일)
      const l2Coords = [
        { x: 8, y: 4 }, { x: 10, y: 4 },
        { x: 8, y: 6 }, { x: 10, y: 6 }
      ];
      l2Coords.forEach(c => slots.push({ slotId: nextId++, x: c.x, y: c.y, z: 2 }));

      return slots; // 총 54개
    }

    /**
     * 메인 마작 솔리테어 게임 엔진
     */
    class MahjongGame {
      constructor() {
        this.boardEl = document.getElementById('board');
        this.viewportEl = document.getElementById('viewport');
        this.sound = new SoundFX();

        this.tiles = [];
        this.selectedTile = null;
        this.undoStack = [];
        this.score = 0;
        this.timerSeconds = 0;
        this.timerId = null;
        this.isClear = false;
        this.isAutoClearing = false;
        this.autoClearTimeouts = [];

        // 난이도 및 무한 판수(스테이지) 설정
        this.difficulty = 'normal';
        this.currentStage = 1;

        this.bindEvents();
        this.startNewGame();
      }

      bindEvents() {
        window.addEventListener('resize', () => this.handleResize());
        window.addEventListener('orientationchange', () => {
          setTimeout(() => this.handleResize(), 150);
        });
        document.addEventListener('fullscreenchange', () => this.updateFullscreenUI());
        document.addEventListener('webkitfullscreenchange', () => this.updateFullscreenUI());

        // 난이도 셀렉트 박스 이벤트
        const diffSelect = document.getElementById('select-difficulty');
        if (diffSelect) {
          diffSelect.addEventListener('change', (e) => {
            this.setDifficulty(e.target.value);
          });
        }

        document.getElementById('btn-fullscreen').addEventListener('click', () => this.toggleFullscreen());
        document.getElementById('btn-undo').addEventListener('click', () => this.undo());
        document.getElementById('btn-hint').addEventListener('click', () => this.showHint());
        document.getElementById('btn-shuffle').addEventListener('click', () => this.shuffleRemain());
        document.getElementById('btn-restart').addEventListener('click', () => {
          this.currentStage = 1;
          this.startNewGame();
        });

        // 모달에서 '다음 판 시작' 클릭 시 무한정 다음 판으로 계속 진행
        document.getElementById('modal-confirm-btn').addEventListener('click', () => {
          document.getElementById('modal').classList.remove('active');
          this.currentStage++;
          this.startNewGame();
        });
      }

      setDifficulty(diffKey) {
        if (!DIFFICULTY_CONFIG[diffKey]) return;
        this.difficulty = diffKey;
        this.currentStage = 1; // 난이도 변경 시 1판부터 시작
        const selectEl = document.getElementById('select-difficulty');
        if (selectEl) selectEl.value = diffKey;
        this.startNewGame();
      }

      startNewGame() {
        this.sound.init();
        clearInterval(this.timerId);
        this.timerSeconds = 0;
        this.score = 0;
        this.undoStack = [];
        this.selectedTile = null;
        this.isClear = false;
        this.isAutoClearing = false;

        if (this.autoClearTimeouts) {
          this.autoClearTimeouts.forEach(t => clearTimeout(t));
        }
        this.autoClearTimeouts = [];

        // 화면 효과 및 파편/배너 초기화
        this.viewportEl.classList.remove('shaking');
        const oldNotice = document.getElementById('finale-notice');
        if (oldNotice) oldNotice.remove();
        const oldShatter = document.getElementById('shatter-container');
        if (oldShatter) oldShatter.remove();
        const oldBanner = document.getElementById('big-win-banner');
        if (oldBanner) oldBanner.remove();

        this.boardEl.style.opacity = '1';
        this.boardEl.style.display = 'block';
        this.boardEl.style.filter = '';
        this.boardEl.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.3, 1)';

        document.getElementById('btn-undo').disabled = true;
        document.getElementById('btn-shuffle').disabled = false;
        document.getElementById('btn-hint').disabled = false;

        this.updateHeaderUI();
        this.buildSolvableBoard();
        this.renderBoard();
        this.handleResize();

        this.timerId = setInterval(() => {
          this.timerSeconds++;
          document.getElementById('stat-time').textContent = this.formatTime(this.timerSeconds);
        }, 1000);
      }

      /**
       * 100% 클리어 가능 보장 역생성(Reverse Solvable Generation) 알고리즘
       * 난이도에 따른 필터링된 패 라이브러리(availablePool)에서 27쌍 추출
       */
      buildSolvableBoard() {
        const slots = createBoardLayout();
        const numPairs = slots.length / 2;

        const diffCfg = DIFFICULTY_CONFIG[this.difficulty] || DIFFICULTY_CONFIG.normal;
        const availablePool = TILE_DEFINITIONS.filter(diffCfg.filter);

        const chosenDefs = [];
        const poolCopy = [...availablePool];

        for (let i = 0; i < numPairs; i++) {
          const randIdx = Math.floor(Math.random() * poolCopy.length);
          chosenDefs.push(poolCopy[randIdx]);
          if (poolCopy.length > numPairs - i) {
            poolCopy.splice(randIdx, 1);
          }
        }

        let success = false;
        let resultTiles = [];

        for (let attempt = 0; attempt < 100 && !success; attempt++) {
          const currentSlots = slots.map(s => ({ ...s }));
          const tempPairs = [...chosenDefs];
          const assignments = [];

          while (tempPairs.length > 0) {
            const freeSlots = currentSlots.filter(s => this.isSlotFree(s, currentSlots));
            if (freeSlots.length < 2) break;

            const idx1 = Math.floor(Math.random() * freeSlots.length);
            const slotA = freeSlots.splice(idx1, 1)[0];
            const idx2 = Math.floor(Math.random() * freeSlots.length);
            const slotB = freeSlots.splice(idx2, 1)[0];

            const def = tempPairs.pop();
            assignments.push({ slot: slotA, def });
            assignments.push({ slot: slotB, def });

            const remIdxA = currentSlots.findIndex(s => s.slotId === slotA.slotId);
            currentSlots.splice(remIdxA, 1);
            const remIdxB = currentSlots.findIndex(s => s.slotId === slotB.slotId);
            currentSlots.splice(remIdxB, 1);
          }

          if (tempPairs.length === 0) {
            success = true;
            resultTiles = assignments.map((item, idx) => ({
              id: 'tile_' + idx,
              slotId: item.slot.slotId,
              x: item.slot.x,
              y: item.slot.y,
              z: item.slot.z,
              def: item.def,
              removed: false
            }));
          }
        }

        if (!success) {
          const shuffledSlots = [...slots].sort(() => Math.random() - 0.5);
          resultTiles = [];
          for (let i = 0; i < numPairs; i++) {
            const def = chosenDefs[i];
            const s1 = shuffledSlots[i * 2];
            const s2 = shuffledSlots[i * 2 + 1];
            resultTiles.push({ id: 'tile_' + (i * 2), slotId: s1.slotId, x: s1.x, y: s1.y, z: s1.z, def, removed: false });
            resultTiles.push({ id: 'tile_' + (i * 2 + 1), slotId: s2.slotId, x: s2.x, y: s2.y, z: s2.z, def, removed: false });
          }
        }

        this.tiles = resultTiles;
      }

      isSlotFree(slot, slotList) {
        const hasCover = slotList.some(other => {
          if (other.slotId === slot.slotId) return false;
          if (other.z !== slot.z + 1) return false;
          return Math.abs(other.x - slot.x) < 2 && Math.abs(other.y - slot.y) < 2;
        });
        if (hasCover) return false;

        const blockedLeft = slotList.some(other => {
          if (other.slotId === slot.slotId || other.z !== slot.z) return false;
          return (slot.x - other.x <= 2 && slot.x - other.x > 0) && Math.abs(other.y - slot.y) < 2;
        });

        const blockedRight = slotList.some(other => {
          if (other.slotId === slot.slotId || other.z !== slot.z) return false;
          return (other.x - slot.x <= 2 && other.x - slot.x > 0) && Math.abs(other.y - slot.y) < 2;
        });

        return !blockedLeft || !blockedRight;
      }

      isTileFree(tile) {
        if (tile.removed) return false;
        const activeTiles = this.tiles.filter(t => !t.removed && t.id !== tile.id);

        const covered = activeTiles.some(other => {
          if (other.z !== tile.z + 1) return false;
          return Math.abs(other.x - tile.x) < 2 && Math.abs(other.y - tile.y) < 2;
        });
        if (covered) return false;

        const blockedLeft = activeTiles.some(other => {
          if (other.z !== tile.z) return false;
          return (tile.x - other.x <= 2 && tile.x - other.x > 0) && Math.abs(other.y - tile.y) < 2;
        });

        const blockedRight = activeTiles.some(other => {
          if (other.z !== tile.z) return false;
          return (other.x - tile.x <= 2 && other.x - tile.x > 0) && Math.abs(other.y - tile.y) < 2;
        });

        return !blockedLeft || !blockedRight;
      }

      /**
       * DOM 렌더링 및 위치 스타일 적용
       */
      renderBoard() {
        this.boardEl.innerHTML = '';

        const sorted = [...this.tiles].sort((a, b) => {
          if (a.z !== b.z) return a.z - b.z;
          if (a.y !== b.y) return a.y - b.y;
          return a.x - b.x;
        });

        sorted.forEach(tile => {
          const el = document.createElement('div');
          el.className = `tile layer-${tile.z}`;
          el.id = tile.id;
          el.dataset.layer = tile.z;

          // 그리드 간격 (가로: 35px, 세로: 43px)
          const posX = tile.x * 35 + 16;
          const posY = tile.y * 43 + 12;

          // 층(z: 0, 1, 2)별 상단-좌측 시차 오프셋 (아이소메트릭 단차감 강조)
          const zStep = 6;
          const finalX = posX - tile.z * zStep;
          const finalY = posY - tile.z * (zStep * 1.35);
          const finalZ = tile.z * 18;

          el.style.setProperty('--tx', `${finalX}px`);
          el.style.setProperty('--ty', `${finalY}px`);
          el.style.setProperty('--tz', `${finalZ}px`);
          el.style.transform = `translate3d(${finalX}px, ${finalY}px, ${finalZ}px)`;
          el.style.zIndex = tile.z * 100 + tile.y * 10 + tile.x;

          el.innerHTML = `
            <span class="tile-corner-badge">${tile.def.badge}</span>
            <div class="tile-graphic-wrap">
              ${tile.def.render()}
            </div>
            <span class="tile-sub-label">${tile.def.label}</span>
          `;

          el.addEventListener('click', (e) => {
            e.stopPropagation();
            this.handleTileClick(tile);
          });

          this.boardEl.appendChild(el);
          tile.el = el;
        });

        this.updateTileStates();
      }

      updateTileStates() {
        const activeTiles = this.tiles.filter(t => !t.removed);

        activeTiles.forEach(tile => {
          const free = this.isTileFree(tile);
          tile.free = free;
          if (tile.el) {
            tile.el.classList.toggle('free', free);
            tile.el.classList.toggle('blocked', !free);
          }
        });

        const availablePairs = this.getAvailablePairs();
        document.getElementById('stat-moves').textContent = availablePairs.length;
        document.getElementById('stat-tiles').textContent = activeTiles.length;
        document.getElementById('btn-undo').disabled = this.undoStack.length === 0;

        if (availablePairs.length === 0 && activeTiles.length > 0) {
          setTimeout(() => {
            if (!this.isClear && confirm("더 이상 맞출 수 있는 패가 없습니다!\n패를 섞으시겠습니까?")) {
              this.shuffleRemain();
            }
          }, 300);
        }
      }

      handleTileClick(tile) {
        if (this.isAutoClearing || tile.removed || !this.isTileFree(tile)) {
          return;
        }

        this.clearHints();

        // 1) 이미 선택된 패 재클릭 시 선택 취소
        if (this.selectedTile && this.selectedTile.id === tile.id) {
          this.sound.playSelect();
          tile.el.classList.remove('selected');
          this.selectedTile = null;
          return;
        }

        // 2) 첫 번째 패 선택
        if (!this.selectedTile) {
          this.sound.playSelect();
          this.selectedTile = tile;
          tile.el.classList.add('selected');
          return;
        }

        // 3) 두 번째 패 선택: 일치 여부 확인
        const first = this.selectedTile;
        if (first.def.id === tile.def.id) {
          this.sound.playMatch();
          first.el.classList.remove('selected');
          this.selectedTile = null;

          first.el.classList.add('matching');
          tile.el.classList.add('matching');

          first.removed = true;
          tile.removed = true;

          this.undoStack.push([first, tile]);
          this.score += 100;

          setTimeout(() => {
            if (first.el) first.el.style.display = 'none';
            if (tile.el) tile.el.style.display = 'none';
            this.updateTileStates();

            const remain = this.tiles.filter(t => !t.removed).length;
            if (remain > 0 && remain <= 10 && !this.isAutoClearing) {
              this.triggerAutoClearFinale();
            } else {
              this.checkWinCondition();
            }
          }, 380);

        } else {
          this.sound.playSelect();
          first.el.classList.remove('selected');
          this.selectedTile = tile;
          tile.el.classList.add('selected');
        }

        this.updateHeaderUI();
      }

      getAvailablePairs() {
        const freeTiles = this.tiles.filter(t => !t.removed && this.isTileFree(t));
        const pairs = [];

        for (let i = 0; i < freeTiles.length; i++) {
          for (let j = i + 1; j < freeTiles.length; j++) {
            if (freeTiles[i].def.id === freeTiles[j].def.id) {
              pairs.push([freeTiles[i], freeTiles[j]]);
            }
          }
        }
        return pairs;
      }

      showHint() {
        if (this.isAutoClearing) return;
        this.clearHints();
        const pairs = this.getAvailablePairs();
        if (pairs.length > 0) {
          this.sound.playSelect();
          const [t1, t2] = pairs[0];
          t1.el.classList.add('hinted');
          t2.el.classList.add('hinted');
          setTimeout(() => this.clearHints(), 3200);
        } else {
          alert("현재 맞출 수 있는 패가 없습니다. 셔플을 눌러주세요.");
        }
      }

      clearHints() {
        this.tiles.forEach(t => {
          if (t.el) t.el.classList.remove('hinted');
        });
      }

      undo() {
        if (this.isAutoClearing || this.undoStack.length === 0) return;
        this.sound.playSelect();
        this.clearHints();
        if (this.selectedTile) {
          this.selectedTile.el.classList.remove('selected');
          this.selectedTile = null;
        }

        const [t1, t2] = this.undoStack.pop();
        t1.removed = false;
        t2.removed = false;

        t1.el.style.display = 'flex';
        t2.el.style.display = 'flex';
        t1.el.classList.remove('matching');
        t2.el.classList.remove('matching');

        this.score = Math.max(0, this.score - 50);
        this.updateHeaderUI();
        this.updateTileStates();
      }

      shuffleRemain() {
        if (this.isAutoClearing) return;
        const activeTiles = this.tiles.filter(t => !t.removed);
        if (activeTiles.length === 0) return;

        this.sound.playShuffle();
        this.clearHints();
        if (this.selectedTile) {
          this.selectedTile.el.classList.remove('selected');
          this.selectedTile = null;
        }

        const activeDefs = activeTiles.map(t => t.def).sort(() => Math.random() - 0.5);

        activeTiles.forEach((tile, i) => {
          tile.def = activeDefs[i];

          const badgeEl = tile.el.querySelector('.tile-corner-badge');
          const wrapEl = tile.el.querySelector('.tile-graphic-wrap');
          const subEl = tile.el.querySelector('.tile-sub-label');

          if (badgeEl) badgeEl.textContent = tile.def.badge;
          if (wrapEl) wrapEl.innerHTML = tile.def.render();
          if (subEl) subEl.textContent = tile.def.label;

          tile.el.style.transition = 'transform 0.25s ease';
          tile.el.style.transform += ' scale(0.92)';
          setTimeout(() => {
            tile.el.style.transform = tile.el.style.transform.replace(' scale(0.92)', '');
          }, 240);
        });

        this.updateTileStates();
      }

      /**
       * 패가 10개 이하일 때 발동하는 자동 피날레 클리어 연출
       */
      triggerAutoClearFinale() {
        if (this.isAutoClearing) return;
        this.isAutoClearing = true;
        this.clearHints();

        if (this.selectedTile) {
          this.selectedTile.el.classList.remove('selected');
          this.selectedTile = null;
        }

        // 조작 컨트롤 버튼 비활성화
        document.getElementById('btn-undo').disabled = true;
        document.getElementById('btn-shuffle').disabled = true;
        document.getElementById('btn-hint').disabled = true;

        const remainCount = this.tiles.filter(t => !t.removed).length;

        // 1) 피날레 알림 배지 표시
        let notice = document.getElementById('finale-notice');
        if (!notice) {
          notice = document.createElement('div');
          notice.id = 'finale-notice';
          notice.className = 'finale-notice';
          this.viewportEl.appendChild(notice);
        }
        notice.textContent = `⚡ 남은 패 ${remainCount}개 피날레! 자동 클리어 발동`;
        notice.classList.add('active');

        // 2) 남은 활성 패들을 짝(Pair)으로 구성
        const activeTiles = this.tiles.filter(t => !t.removed);
        const groups = {};
        activeTiles.forEach(t => {
          if (!groups[t.def.id]) groups[t.def.id] = [];
          groups[t.def.id].push(t);
        });

        const pairsToClear = [];
        Object.values(groups).forEach(list => {
          while (list.length >= 2) {
            pairsToClear.push([list.pop(), list.pop()]);
          }
        });

        // 짝이 홀수로 남은 경우 처리
        const unassigned = [];
        Object.values(groups).forEach(list => {
          while (list.length > 0) unassigned.push(list.pop());
        });
        while (unassigned.length >= 2) {
          pairsToClear.push([unassigned.pop(), unassigned.pop()]);
        }

        // 3) 연속 고속 매칭 연출 실행 (0.16초 간격)
        pairsToClear.forEach(([t1, t2], idx) => {
          const tId = setTimeout(() => {
            if (!this.isAutoClearing) return;
            if (t1 && t1.el) t1.el.classList.add('matching');
            if (t2 && t2.el) t2.el.classList.add('matching');
            if (t1) t1.removed = true;
            if (t2) t2.removed = true;

            this.sound.playMatch();
            this.score += 100;
            this.updateHeaderUI();

            const curActive = this.tiles.filter(t => !t.removed).length;
            document.getElementById('stat-tiles').textContent = curActive;
            document.getElementById('stat-moves').textContent = Math.floor(curActive / 2);

            setTimeout(() => {
              if (t1 && t1.el) t1.el.style.display = 'none';
              if (t2 && t2.el) t2.el.style.display = 'none';
            }, 360);
          }, idx * 170 + 250);
          this.autoClearTimeouts.push(tId);
        });

        // 4) 패 제거가 모두 완료된 후 판 깨짐 및 WIN 연출
        const shatterDelay = pairsToClear.length * 170 + 650;
        const shatterTimer = setTimeout(() => {
          if (!this.isAutoClearing) return;
          if (notice) notice.classList.remove('active');
          this.triggerBoardShatter();
        }, shatterDelay);
        this.autoClearTimeouts.push(shatterTimer);
      }

      /**
       * 판이 깨지고 WIN 표시가 터져 나오는 피날레 연출
       */
      triggerBoardShatter() {
        this.sound.playShatter();

        // 1) 화면 지진/흔들림 효과
        this.viewportEl.classList.remove('shaking');
        void this.viewportEl.offsetWidth;
        this.viewportEl.classList.add('shaking');
        setTimeout(() => this.viewportEl.classList.remove('shaking'), 600);

        // 2) 판(보드) 파편 분할 및 사방 비산 연출
        const shatterContainer = document.createElement('div');
        shatterContainer.className = 'board-shatter-container';
        shatterContainer.id = 'shatter-container';
        this.viewportEl.appendChild(shatterContainer);

        const boardRect = this.boardEl.getBoundingClientRect();
        const viewportRect = this.viewportEl.getBoundingClientRect();

        const originLeft = boardRect.left - viewportRect.left;
        const originTop = boardRect.top - viewportRect.top;
        const width = boardRect.width;
        const height = boardRect.height;

        const rows = 4;
        const cols = 4;
        const pieceW = width / cols;
        const pieceH = height / rows;

        const pieces = [];

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const piece = document.createElement('div');
            piece.className = 'shatter-piece';
            piece.style.width = `${pieceW}px`;
            piece.style.height = `${pieceH}px`;
            piece.style.left = `${originLeft + c * pieceW}px`;
            piece.style.top = `${originTop + r * pieceH}px`;
            shatterContainer.appendChild(piece);
            pieces.push({ el: piece, r, c });
          }
        }

        // 보드 본체 페이드아웃 & 폭발
        this.boardEl.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        this.boardEl.style.opacity = '0';
        this.boardEl.style.transform += ' scale(1.08)';

        // 파편 조각들 사방으로 폭발하며 회전 비산
        requestAnimationFrame(() => {
          pieces.forEach(({ el, r, c }) => {
            const angle = Math.atan2(r - rows / 2, c - cols / 2) + (Math.random() - 0.5) * 0.6;
            const dist = 200 + Math.random() * 240;
            const dx = Math.cos(angle) * dist;
            const dy = Math.sin(angle) * dist + 130; // 중력 낙하
            const rot = (Math.random() - 0.5) * 480;
            const scale = 0.25 + Math.random() * 0.4;

            el.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(${scale})`;
            el.style.opacity = '0';
          });
        });

        // 3) 대형 황금 WIN 배너 팝업
        const oldBanner = document.getElementById('big-win-banner');
        if (oldBanner) oldBanner.remove();

        const winBanner = document.createElement('div');
        winBanner.className = 'big-win-banner';
        winBanner.id = 'big-win-banner';
        winBanner.innerHTML = '🏆 WIN!';
        this.viewportEl.appendChild(winBanner);

        // 4) 최종 승리 모달 활성화
        const winTimer = setTimeout(() => {
          this.sound.playWin();
          this.isClear = true;
          clearInterval(this.timerId);
          this.showVictoryModal();
        }, 950);
        this.autoClearTimeouts.push(winTimer);
      }

      checkWinCondition() {
        const remain = this.tiles.filter(t => !t.removed).length;
        if (remain === 0 && !this.isClear) {
          this.isClear = true;
          clearInterval(this.timerId);
          this.sound.playWin();
          this.showVictoryModal();
        }
      }

      showVictoryModal() {
        const diffCfg = DIFFICULTY_CONFIG[this.difficulty] || DIFFICULTY_CONFIG.normal;
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const confirmBtn = document.getElementById('modal-confirm-btn');

        modalTitle.textContent = `제 ${this.currentStage}판 클리어!`;
        modalDesc.textContent = `[${diffCfg.name}] 난이도 제 ${this.currentStage}판을 완벽하게 격파했습니다! 다음 판에 도전하세요.`;
        confirmBtn.textContent = `다음 판 시작 (제 ${this.currentStage + 1}판) ➔`;

        document.getElementById('modal-time').textContent = this.formatTime(this.timerSeconds);
        document.getElementById('modal-score').textContent = this.score;
        document.getElementById('modal').classList.add('active');
      }

      updateHeaderUI() {
        document.getElementById('stat-score').textContent = this.score;
        document.getElementById('btn-undo').disabled = this.undoStack.length === 0;

        const diffCfg = DIFFICULTY_CONFIG[this.difficulty] || DIFFICULTY_CONFIG.normal;
        const stageEl = document.getElementById('stat-stage');
        const diffEl = document.getElementById('stat-diff');
        if (stageEl) stageEl.textContent = `${this.currentStage}판`;
        if (diffEl) {
          diffEl.textContent = diffCfg.name;
          diffEl.style.backgroundColor = diffCfg.badgeColor;
        }
      }

      formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      toggleFullscreen() {
        const doc = document;
        const docEl = document.documentElement;
        const isFull = !!(doc.fullscreenElement || doc.webkitFullscreenElement);

        if (!isFull) {
          if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(() => {});
          } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
          }
        } else {
          if (doc.exitFullscreen) {
            doc.exitFullscreen().catch(() => {});
          } else if (doc.webkitExitFullscreen) {
            doc.webkitExitFullscreen();
          }
        }
      }

      updateFullscreenUI() {
        const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
        const btnFsText = document.getElementById('btn-fs-text');
        const btnFs = document.getElementById('btn-fullscreen');
        if (btnFsText) {
          btnFsText.textContent = isFull ? '창모드' : '전체화면';
        }
        if (btnFs) {
          const icon = btnFs.querySelector('.btn-icon');
          if (icon) icon.textContent = isFull ? '🗗' : '⛶';
        }
        setTimeout(() => this.handleResize(), 100);
      }

      handleResize() {
        if (!this.viewportEl || !this.boardEl) return;
        const vw = this.viewportEl.clientWidth;
        const vh = this.viewportEl.clientHeight;

        const boardW = 730;
        const boardH = 545;

        const isMobile = vw < 680;
        const isPortrait = vw < vh;

        // 모바일/태블릿 여백 축소로 보드 표시 영역 극대화
        const marginX = isMobile ? 8 : (vw < 960 ? 16 : 28);
        const marginY = isMobile ? (vh < 600 ? 6 : 14) : 24;

        const scaleX = (vw - marginX) / boardW;
        const scaleY = (vh - marginY) / boardH;

        // 기본 비율 맞춤
        let scale = Math.min(scaleX, scaleY);

        // 모바일 세로 모드(portrait)일 때 가로폭을 채우도록 스케일 보정
        if (isMobile && isPortrait) {
          scale = Math.min(scaleX * 0.99, scaleY);
        }

        // 최대 1.35배 확대, 최소 0.48 보장
        scale = Math.min(1.35, Math.max(0.48, scale));

        // 3D 틸트: 세로모드에서는 왜곡과 축소를 방지하기 위해 7도로 완화
        const tiltX = (isMobile && isPortrait) ? 7 : 12;
        this.boardEl.style.transform = `rotateX(${tiltX}deg) scale(${scale.toFixed(3)})`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new MahjongGame();
    });
  </script>
