      margin: 0;
      padding: 0;
    }

      font-family: 'Pretendard', sans-serif;

      padding: 40px 24px;

      text-align: center;
    }

    h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, #ffd54f 60%, #ffb300 100%);

      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.6;
      max-width: 780px;
      margin: 0 auto 24px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;

      padding: 14px 24px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 700px;
      margin: 0 auto 40px;
    }

    .size-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .size-btn:hover {
      background: rgba(255, 215, 64, 0.2);
      color: #fff;
    }

    .size-btn.active {
      background: linear-gradient(135deg, #ffd54f 0%, #ffb300 100%);
      color: #0b0f17;
      border-color: #ffd54f;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(255, 213, 79, 0.35);
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #ffd54f;
      font-weight: 600;
      cursor: pointer;
      margin-left: 12px;
    }

    .toggle-label input {
      accent-color: #ffd54f;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

      max-width: 1280px;
      margin: 0 auto 48px;
    }

      font-family: 'Noto Serif KR', serif;
      font-size: 20px;
      font-weight: 900;
      color: #e2e8f0;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }

    .cat-badge {
      font-family: 'Pretendard', sans-serif;
      font-size: 12px;
      background: rgba(255, 215, 64, 0.15);
      color: #ffd54f;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 64, 0.3);

    .tile-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: flex-start;
    }

    /* 타일 래퍼 */
    .tile-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .tile-item:hover {
      transform: translateY(-6px) scale(1.03);
    }

    .tile-svg-container {
      transition: width 0.2s, height 0.2s;
    }

    .view-small .tile-svg-container { width: 56px; height: 70px; }
    .view-medium .tile-svg-container { width: 96px; height: 120px; }
    .view-large .tile-svg-container { width: 160px; height: 200px; }

    .tile-svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
    }

    .tile-name {
      margin-top: 8px;
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
      text-align: center;
    }

      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 7, 12, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;

      display: flex;

      border-radius: 24px;

      flex-direction: column;
      align-items: center;
      position: relative;

      color: #ffd54f;
      margin-bottom: 8px;

      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }

      position: absolute;
      top: 16px;
      right: 18px;
      background: none;
      border: none;
      color: #94a3b8;

      AI가 생성한 <strong>순수 3D 실물 마작패 이미지(WebP)</strong>를 바탕에 깔고, 
      그 위에 <strong>SVG 벡터 뱃지 & 한자/한글 텍스트</strong>를 실시간으로 합성 렌더링한 하이브리드 시스템입니다.
      모바일 48px 축소 화면부터 240px 전체화면까지 글자가 절대 번지거나 깨지지 않습니다.
    </p>

      <button class="size-btn active" onclick="setSize('medium', this)">도감 (96x120)</button>
      <button class="size-btn" onclick="setSize('large', this)">대형 (160x200)</button>

          { id: 'dragon_head_black_tile', badge: '黑', color: '#37474f', sub: '흑용두', seal: '黑龍', name: '흑용두 (흑요석 뇌전 흑룡 머리)' },
          { id: 'dragon_head_purple_tile', badge: '紫', color: '#8e24aa', sub: '자용두', seal: '紫龍', name: '자용두 (미스터리 보라 용머리 - Mystery Choice)' },
          { id: 'dragon_head_blue_tile', badge: '靑', color: '#1e88e5', sub: '청용두', seal: '靑龍', name: '청용두 (심해 사파이어 청룡 머리)' },
          { id: 'dragon_head_yellow_tile', badge: '黃', color: '#fbc02d', sub: '황용두', seal: '黃龍', name: '황용두 (24K 순금 황금룡 머리)' },
          { id: 'dragon_head_green_tile', badge: '綠', color: '#43a047', sub: '녹용두', seal: '綠龍', name: '녹용두 (비취 비단 에메랄드 녹룡 머리)' }
        ]
      },
      dragon_gold: {
        title: "황금용두(黃金龍頭) 누끼 7색 변형",
        desc: "업로드 황금용두를 기반으로 색조 변환한 7가지 컬러 용두 패",
        items: [
          { id: 'dragon_gold_white_tile',  badge: '白', color: '#78909c', sub: '백금용두', seal: '白金龍', name: '백금용두 (순은빛 백룡 누끼)', isPng: true },
          { id: 'dragon_gold_red_tile',    badge: '赤', color: '#e53935', sub: '적금용두', seal: '赤金龍', name: '적금용두 (화염 적룡 누끼)', isPng: true },
          { id: 'dragon_gold_black_tile',  badge: '黑', color: '#37474f', sub: '흑금용두', seal: '黑金龍', name: '흑금용두 (흑요석 흑룡 누끼)', isPng: true },
          { id: 'dragon_gold_purple_tile', badge: '紫', color: '#8e24aa', sub: '자금용두', seal: '紫金龍', name: '자금용두 (보라 자룡 누끼)', isPng: true },
          { id: 'dragon_gold_blue_tile',   badge: '靑', color: '#1e88e5', sub: '청금용두', seal: '靑金龍', name: '청금용두 (사파이어 청룡 누끼)', isPng: true },
          { id: 'dragon_gold_yellow_tile', badge: '黃', color: '#fbc02d', sub: '황금용두', seal: '黃金龍', name: '황금용두 (24K 황금룡 누끼)', isPng: true },
          { id: 'dragon_gold_green_tile',  badge: '綠', color: '#43a047', sub: '녹금용두', seal: '綠金龍', name: '녹금용두 (에메랄드 녹룡 누끼)', isPng: true }
        ]
      }
    };

    let showSvgOverlay = true;

    // =========================================================================
    // SVG 하이브리드 렌더러 함수 (3D 무글자 WebP + SVG 실시간 벡터 텍스트/뱃지)
    // =========================================================================
    function renderHybridTileSvg(tile, enableSvg = true) {
      const { id, badge, color, sub, seal, isDouble } = tile;

      // 파스텔 낙관 배경색 (단청 색상 15% + 상아색 85% 부드러운 조화)
      const sealBg = `color-mix(in srgb, ${color} 14%, #fcf9f2)`;

      let badgeSvg = '';
      if (enableSvg) {
        if (isDouble && badge.length >= 2) {
          // 십성 2글자 세로형 황실 단청 배지
          badgeSvg = `
            <g class="svg-badge">
              <!-- 그림자 -->
              <rect x="15" y="14" width="58" height="92" rx="12" ry="12" fill="rgba(0,0,0,0.35)" />
              <!-- 본체 단청 솔리드 + 황금 림 -->
              <rect x="14" y="12" width="58" height="92" rx="12" ry="12" fill="${color}" stroke="#FFD54F" stroke-width="2.5" />
              <!-- 안쪽 미세 테두리 -->
              <rect x="16.5" y="14.5" width="53" height="87" rx="10" ry="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
              <!-- 서예 명조 2글자 텍스트 -->
              <text x="43" y="49" text-anchor="middle" font-family="'Noto Serif KR', serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="-1">${badge[0]}</text>
              <text x="43" y="87" text-anchor="middle" font-family="'Noto Serif KR', serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="-1">${badge[1]}</text>
            </g>
          `;
        } else {
          // 1글자 사각 황실 단청 배지
          badgeSvg = `
            <g class="svg-badge">
              <!-- 그림자 -->
              <rect x="15" y="14" width="58" height="60" rx="12" ry="12" fill="rgba(0,0,0,0.35)" />
              <!-- 본체 단청 솔리드 + 황금 림 -->
              <rect x="14" y="12" width="58" height="60" rx="12" ry="12" fill="${color}" stroke="#FFD54F" stroke-width="2.5" />
              <!-- 안쪽 미세 테두리 -->
              <rect x="16.5" y="14.5" width="53" height="55" rx="10" ry="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
              <!-- 서예 명조 한자 텍스트 -->
              <text x="43" y="55" text-anchor="middle" font-family="'Noto Serif KR', serif" font-weight="900" font-size="34" fill="#FFFFFF">${badge}</text>
            </g>
          `;
        }
      }

      let bottomSvg = '';
      if (enableSvg) {
        bottomSvg = `
          <g class="svg-bottom">
            <!-- 좌하단 한글 약칭 (또렷하고 굵은 Pretendard) -->
            <!-- 텍스트 하이라이트/외곽선 -->
            <text x="20" y="274" font-family="'Pretendard', sans-serif" font-weight="900" font-size="26" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.8)" stroke-width="4" stroke-linejoin="round">${sub}</text>
            <text x="20" y="274" font-family="'Pretendard', sans-serif" font-weight="900" font-size="26" fill="${color}">${sub}</text>

            <!-- 우하단 조선 어보 스타일 낙관 인장 -->
            <g transform="translate(142, 244)">
              <rect x="1" y="2" width="82" height="40" rx="7" ry="7" fill="rgba(0,0,0,0.25)" />
              <rect x="0" y="0" width="82" height="40" rx="7" ry="7" fill="${sealBg}" stroke="${color}" stroke-width="2.2" />
              <rect x="3" y="3" width="76" height="34" rx="5" ry="5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1" />
              <text x="41" y="27" text-anchor="middle" font-family="'Noto Serif KR', serif" font-weight="900" font-size="20" fill="${color}" letter-spacing="1">${seal}</text>
            </g>
          </g>
        `;
      }

      return `
        <svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
          <!-- 1. 초고화질 무글자 3D 실물 마작패 이미지 -->
          <image href="${tile.isPng ? '../assets/dragons/' + id + '.png' : id.startsWith('dragon_head_') ? '../assets/dragons/' + id + '.webp' : '../assets/tiles/' + id + '.webp'}" x="0" y="0" width="240" height="300" preserveAspectRatio="none" />

          <!-- 2. 좌상단 SVG 전통 단청 배지 -->
          ${badgeSvg}

          <!-- 3. 하단 실시간 SVG 텍스트 (한글 명칭 + 낙관 인장) -->
          ${bottomSvg}
        </svg>
      `;
    }

    // =========================================================================
    // 페이지 렌더링
    // =========================================================================
    function renderApp() {
      const app = document.getElementById('app');
      let html = '';

      for (const [key, section] of Object.entries(TILES_DATA)) {
        html += `
          <section class="category-section">
            <h2 class="cat-title">
              ${section.title}
              <span class="cat-badge">${section.items.length}종</span>
              <span style="font-size: 13px; color: #64748b; font-weight: 400; margin-left: auto;">${section.desc}</span>
            </h2>
            <div class="tile-grid">
              ${section.items.map(tile => `
                <div class="tile-item" onclick="openModal('${tile.id}')">
                  <div class="tile-svg-container" id="tile_wrap_${tile.id}">
                    ${renderHybridTileSvg(tile, showSvgOverlay)}
                  </div>
                  <span class="tile-name">${tile.sub}</span>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }

      app.innerHTML = html;
    }

    // =========================================================================
    // 크기 제어 & 인터랙션
    // =========================================================================
    function setSize(sizeClass, btn) {
      document.body.className = `view-${sizeClass}`;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function toggleSvgOverlay() {
      showSvgOverlay = document.getElementById('toggleSvg').checked;
      for (const section of Object.values(TILES_DATA)) {
        for (const tile of section.items) {
          const wrap = document.getElementById(`tile_wrap_${tile.id}`);
          if (wrap) {
            wrap.innerHTML = renderHybridTileSvg(tile, showSvgOverlay);
          }
        }
      }
    }

    // =========================================================================
    // 라이트박스 모달
    // =========================================================================
    function findTile(id) {
      for (const sec of Object.values(TILES_DATA)) {
        const found = sec.items.find(t => t.id === id);
        if (found) return found;
      }
      return null;
    }

    function openModal(id) {
      const tile = findTile(id);
      if (!tile) return;

      document.getElementById('modalTileBox').innerHTML = renderHybridTileSvg(tile, true);
      document.getElementById('modalInfo').innerHTML = `
        <h3>${tile.name}</h3>
        <p>식별 ID: <code>assets/tiles/${tile.id}.webp</code></p>
        <p style="margin-top: 6px; color: #ffd54f;">실시간 SVG: 좌상단 단청 배지('${tile.badge}') + 한글('${tile.sub}') + 어보 낙관('${tile.seal}')</p>
      `;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    // 초기 실행
    renderApp();
  </script>
</body>
</html>
